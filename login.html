<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar | COFRÉ Education Group</title>
    <meta name="description" content="Acceso privado al área interna de COFRÉ Education Group.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary-dark: #1e3a5f;
            --primary-blue: #2b7fbf;
            --primary-light: #5cb3e8;
            --accent-green: #4db8a8;
            --text-dark: #2c3e50;
            --text-light: #6c757d;
            --bg-light: #f8f9fa;
            --border-color: #e9ecef;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-blue) 50%, var(--accent-green) 100%);
            padding: 2rem 1rem;
        }

        .login-card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 2rem;
            animation: fadeInUp 0.6s ease;
        }

        .login-logo {
            display: block;
            height: 80px;
            width: auto;
            margin: 0 auto 1.5rem;
        }

        .login-card h1 {
            text-align: center;
            font-size: 1.5rem;
            color: var(--primary-dark);
            margin-bottom: 0.3rem;
        }

        .login-card .subtitle {
            text-align: center;
            color: var(--text-light);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 1.25rem;
        }

        .form-group label {
            margin-bottom: 0.4rem;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-dark);
        }

        .form-group input {
            padding: 0.8rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: inherit;
            font-size: 1rem;
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(77, 184, 168, 0.25);
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-blue), var(--accent-green));
            color: white;
            padding: 0.9rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-light);
            font-size: 0.85rem;
            margin: 1.25rem 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider span { padding: 0 0.75rem; }

        .google-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: #ffffff;
            color: #3c4043;
            border: 1px solid #dadce0;
            border-radius: 6px;
            padding: 0.8rem;
            font-weight: 600;
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }

        .google-btn:hover {
            background: #f7f8f8;
            box-shadow: 0 1px 3px rgba(60, 64, 67, 0.15);
        }

        .google-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .google-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

        .message {
            margin-top: 1.25rem;
            padding: 0.8rem;
            border-radius: 6px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }

        .message.error {
            display: block;
            background: #fdecea;
            color: #b71c1c;
            border: 1px solid #f5c6cb;
        }

        .message.success {
            display: block;
            background: #e6f4ea;
            color: #1b5e20;
            border: 1px solid #c3e6cb;
        }

        .extra-links {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
        }

        .extra-links a {
            color: var(--primary-blue);
            text-decoration: none;
            cursor: pointer;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.85rem;
        }

        .back-home:hover { color: var(--primary-blue); }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="Logo.png" alt="COFRÉ Education Group" class="login-logo">
        <h1>Acceso privado</h1>
        <p class="subtitle">Ingresa con tus credenciales</p>

        <form id="login-form" autocomplete="on">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required autocomplete="username" placeholder="tu@correo.cl">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
            </div>
            <button type="submit" class="submit-btn" id="submit-btn">Ingresar</button>
        </form>

        <div class="divider"><span>o</span></div>

        <button type="button" class="google-btn" id="google-btn">
            <svg viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
                <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
                <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/>
                <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
            </svg>
            Continuar con Google
        </button>

        <div class="message" id="message"></div>

        <div class="extra-links">
            <a id="reset-link">¿Olvidaste tu contraseña?</a>
        </div>

        <a href="index.html" class="back-home">← Volver al sitio</a>
    </div>

    <!-- Firebase Authentication -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getAuth,
            signInWithEmailAndPassword,
            sendPasswordResetEmail,
            onAuthStateChanged,
            setPersistence,
            browserLocalPersistence,
            GoogleAuthProvider,
            signInWithPopup
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // =================================================================
        //  CONFIGURACIÓN DE FIREBASE
        //  Reemplaza estos valores por los de TU proyecto Firebase.
        //  (Estos datos son públicos a propósito; NO son secretos.)
        //  Los obtienes en: Firebase Console > Configuración del proyecto >
        //  Tus apps > SDK de Firebase > Configuración.
        // =================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyARY-i1JB3lh6Ux1tJdaIkBmLAXpngVom0",
            authDomain: "cofre-education-group.firebaseapp.com",
            projectId: "cofre-education-group",
            storageBucket: "cofre-education-group.firebasestorage.app",
            messagingSenderId: "352407565108",
            appId: "1:352407565108:web:bb955c37dc5c3d0ead2b61",
            measurementId: "G-PWNZEG8T24"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById('login-form');
        const submitBtn = document.getElementById('submit-btn');
        const messageEl = document.getElementById('message');
        const resetLink = document.getElementById('reset-link');

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
        }

        // Si ya hay sesión iniciada, redirigir directo al panel.
        setPersistence(auth, browserLocalPersistence).then(() => {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    window.location.href = 'panel.html';
                }
            });
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Ingresando...';
            messageEl.className = 'message';

            try {
                await signInWithEmailAndPassword(auth, email, password);
                showMessage('¡Acceso correcto! Redirigiendo...', 'success');
                window.location.href = 'panel.html';
            } catch (error) {
                let msg = 'No se pudo iniciar sesión. Revisa tus datos.';
                switch (error.code) {
                    case 'auth/invalid-email': msg = 'El correo no es válido.'; break;
                    case 'auth/user-disabled': msg = 'Esta cuenta está deshabilitada.'; break;
                    case 'auth/user-not-found':
                    case 'auth/wrong-password':
                    case 'auth/invalid-credential': msg = 'Correo o contraseña incorrectos.'; break;
                    case 'auth/too-many-requests': msg = 'Demasiados intentos. Intenta más tarde.'; break;
                    case 'auth/network-request-failed': msg = 'Error de conexión. Revisa tu internet.'; break;
                }
                showMessage(msg, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Ingresar';
            }
        });

        resetLink.addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                showMessage('Escribe tu correo arriba y vuelve a tocar el enlace para enviarte el restablecimiento.', 'error');
                return;
            }
            try {
                await sendPasswordResetEmail(auth, email);
                showMessage('Te enviamos un correo para restablecer tu contraseña.', 'success');
            } catch (error) {
                showMessage('No se pudo enviar el correo de restablecimiento.', 'error');
            }
        });

        // --- Iniciar sesión con Google ---
        const googleBtn = document.getElementById('google-btn');
        const googleProvider = new GoogleAuthProvider();

        googleBtn.addEventListener('click', async () => {
            googleBtn.disabled = true;
            messageEl.className = 'message';
            try {
                await signInWithPopup(auth, googleProvider);
                showMessage('¡Acceso correcto! Redirigiendo...', 'success');
                window.location.href = 'panel.html';
            } catch (error) {
                let msg = 'No se pudo iniciar sesión con Google.';
                switch (error.code) {
                    case 'auth/popup-closed-by-user':
                    case 'auth/cancelled-popup-request':
                        msg = 'Cerraste la ventana de Google antes de terminar.';
                        break;
                    case 'auth/popup-blocked':
                        msg = 'El navegador bloqueó la ventana emergente. Habilítala e intenta de nuevo.';
                        break;
                    case 'auth/account-exists-with-different-credential':
                        msg = 'Ya existe una cuenta con ese correo usando otro método de acceso.';
                        break;
                    case 'auth/operation-not-allowed':
                        msg = 'El acceso con Google no está habilitado todavía. Actívalo en Firebase.';
                        break;
                    case 'auth/unauthorized-domain':
                        msg = 'Este dominio no está autorizado en Firebase.';
                        break;
                    case 'auth/network-request-failed':
                        msg = 'Error de conexión. Revisa tu internet.';
                        break;
                }
                showMessage(msg, 'error');
                googleBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
